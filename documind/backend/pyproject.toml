[project]
name = "documind-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "chromadb==1.5.9",
    "langgraph>=1.2",
    "langchain-google-genai>=2.0",
    "google-genai>=1.0",
    "langchain-openai>=1.4",
    "langchain-anthropic>=1.0",
    "openai>=1.54",
    "cohere>=5.11",
    "langsmith>=0.1",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.12",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "voyageai>=0.5.0",
    "langchain-groq>=1.1.3",
    "certifi>=2026.7.22",
    "grandalf>=0.8",
    "ragas>=0.4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]
